<h2 mat-dialog-title>
  {{ mode === 'create' ? 'Create family' : 'Edit family' }}
</h2>

<form [formGroup]="form" (ngSubmit)="submit()" class="family-form">
  <mat-dialog-content>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Display name</mat-label>
      <input matInput formControlName="name" maxlength="150" required>
      <mat-error *ngIf="form.controls['name'].hasError('required')">Name is required</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Family name (unique)</mat-label>
      <input matInput formControlName="familyName" maxlength="150" required>
      <mat-error *ngIf="form.controls['familyName'].hasError('required')">Family name is required</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Description</mat-label>
      <textarea matInput formControlName="description" rows="3"></textarea>
    </mat-form-field>

    <div class="file-row">
      <button mat-stroked-button type="button" (click)="fileInput.click()">
        <mat-icon>image</mat-icon>
        {{ selectedFile() ? 'Change image' : 'Upload image' }}
      </button>
      <span class="file-name" *ngIf="selectedFile() as file">{{ file.name }}</span>
      <input #fileInput type="file" hidden accept="image/*" (change)="onFileSelected($event)">
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()" [disabled]="submitting()">Cancel</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid || submitting()">
      <mat-spinner *ngIf="submitting()" diameter="18"></mat-spinner>
      <span *ngIf="!submitting()">{{ mode === 'create' ? 'Create' : 'Save' }}</span>
    </button>
  </mat-dialog-actions>
</form>
