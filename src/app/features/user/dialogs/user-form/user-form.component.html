<h2 mat-dialog-title>Edit user</h2>

<form [formGroup]="form" (ngSubmit)="submit()" class="user-form">
  <mat-dialog-content>
    <div class="row">
      <mat-form-field appearance="outline">
        <mat-label>First name</mat-label>
        <input matInput formControlName="firstName">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Last name</mat-label>
        <input matInput formControlName="lastName">
      </mat-form-field>
    </div>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Username</mat-label>
      <input matInput formControlName="userName">
    </mat-form-field>

    <div class="row">
      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput type="email" formControlName="email">
        <mat-error *ngIf="form.controls['email'].hasError('email')">Invalid email</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Phone</mat-label>
        <input matInput formControlName="phone">
      </mat-form-field>
    </div>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Family</mat-label>
      <mat-select formControlName="familyId">
        <mat-option [value]="null">— None —</mat-option>
        <mat-option *ngFor="let f of families()" [value]="f.id">{{ f.name }}</mat-option>
      </mat-select>
    </mat-form-field>

    <div class="file-row">
      <button mat-stroked-button type="button" (click)="fileInput.click()">
        <mat-icon>image</mat-icon>
        {{ selectedFile() ? 'Change avatar' : 'Upload avatar' }}
      </button>
      <span class="file-name" *ngIf="selectedFile() as file">{{ file.name }}</span>
      <input #fileInput type="file" hidden accept="image/*" (change)="onFileSelected($event)">
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()" [disabled]="submitting()">Cancel</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid || submitting()">
      <mat-spinner *ngIf="submitting()" diameter="18"></mat-spinner>
      <span *ngIf="!submitting()">Save</span>
    </button>
  </mat-dialog-actions>
</form>
