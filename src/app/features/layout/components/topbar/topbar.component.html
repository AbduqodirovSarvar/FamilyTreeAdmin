<header class="topbar">
  <button class="menu-btn" (click)="onMenuClick()" aria-label="Toggle navigation">
    <mat-icon>menu</mat-icon>
  </button>

  <nav class="breadcrumbs" aria-label="Breadcrumb">
    <ng-container *ngFor="let c of crumbs(); let last = last">
      <a *ngIf="!last && c.url" [routerLink]="c.url" class="crumb">
        {{ c.key ? (c.key | translate) : c.text }}
      </a>
      <span *ngIf="last" class="crumb current">
        {{ c.key ? (c.key | translate) : c.text }}
      </span>
      <mat-icon *ngIf="!last" class="separator">chevron_right</mat-icon>
    </ng-container>
  </nav>

  <div class="spacer"></div>

  <!-- Language switcher -->
  <button class="lang-btn"
          [matMenuTriggerFor]="langMenu"
          [matTooltip]="'topbar.language' | translate"
          aria-label="Language">
    <span class="lang-code">{{ currentLangShort() }}</span>
    <mat-icon class="lang-caret">arrow_drop_down</mat-icon>
  </button>
  <mat-menu #langMenu="matMenu">
    <button mat-menu-item *ngFor="let l of i18n.availableLangs"
            (click)="setLang(l.value)"
            [class.active-lang]="i18n.lang() === l.value">
      <span class="lang-row">
        <span class="lang-short">{{ l.short }}</span>
        <span>{{ l.label }}</span>
        <mat-icon *ngIf="i18n.lang() === l.value" class="check-icon">check</mat-icon>
      </span>
    </button>
  </mat-menu>

  <!-- Theme toggle -->
  <button class="theme-toggle"
          (click)="toggleTheme()"
          [matTooltip]="(theme.resolvedMode() === 'dark' ? 'topbar.lightMode' : 'topbar.darkMode') | translate">
    <mat-icon *ngIf="theme.resolvedMode() === 'dark'">light_mode</mat-icon>
    <mat-icon *ngIf="theme.resolvedMode() !== 'dark'">dark_mode</mat-icon>
  </button>

  <button class="user-btn" [matMenuTriggerFor]="userMenu" aria-label="User menu">
    <span *ngIf="userName()" class="user-name">{{ userName() }}</span>
    <span class="user-avatar">
      <img *ngIf="userAvatarUrl(); else userIcon" [src]="userAvatarUrl()" alt="" class="user-avatar-img">
      <ng-template #userIcon>
        <mat-icon class="user-avatar-icon">person</mat-icon>
      </ng-template>
    </span>
  </button>

  <mat-menu #userMenu="matMenu">
    <button mat-menu-item (click)="goToSettings()">
      <mat-icon>settings</mat-icon>
      <span>{{ 'nav.settings' | translate }}</span>
    </button>
    <button mat-menu-item (click)="goToProfile()">
      <mat-icon>person</mat-icon>
      <span>{{ 'nav.profile' | translate }}</span>
    </button>
    <button mat-menu-item (click)="goToPassword()">
      <mat-icon>lock</mat-icon>
      <span>{{ 'nav.password' | translate }}</span>
    </button>
    <button mat-menu-item (click)="goToAppearance()">
      <mat-icon>palette</mat-icon>
      <span>{{ 'nav.appearance' | translate }}</span>
    </button>
    <mat-divider></mat-divider>
    <button mat-menu-item (click)="signOut()">
      <mat-icon>logout</mat-icon>
      <span>{{ 'topbar.signOut' | translate }}</span>
    </button>
  </mat-menu>
</header>
