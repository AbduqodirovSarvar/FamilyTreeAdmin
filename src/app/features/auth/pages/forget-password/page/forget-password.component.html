<div class="container">
  <div class="form-container">
    <!-- Logo -->
    <div class="login-logo">
      <mat-icon aria-hidden="false" aria-label="Login icon" fontIcon="lock_reset"></mat-icon>
    </div>

    <!-- Title -->
    <h2 class="login-title">Forgot your password?</h2>
    <p class="login-subtitle">
      Enter your email address and we’ll send you a code to reset your password.
    </p>

    <!-- Form -->
    <form [formGroup]="formGroup" class="login-form">
      <!-- Email Field -->
      <mat-form-field appearance="outline" class="login-form-field">
        <mat-label>Email address</mat-label>
        <input
          matInput
          placeholder="Enter your email"
          formControlName="email"
          type="email"
          autocomplete="email"
        />

        <!-- Validation Errors -->
        <mat-error *ngIf="formGroup.get('email')?.hasError('required')">
          Email is <strong>required</strong>
        </mat-error>
        <mat-error *ngIf="formGroup.get('email')?.hasError('email')">
          Please enter a valid <strong>email address</strong>
        </mat-error>
      </mat-form-field>
    </form>

    <div style="display: flex; gap: 20px;">
        <button
        mat-raised-button
        color="primary"
        class="login-button"
        (click)="create()"
        [disabled]="formGroup.invalid || loading"
      >
        <mat-icon fontIcon="send"></mat-icon>
        <span *ngIf="!loading">Get Reset Code</span>
        <mat-progress-spinner
          *ngIf="loading"
          diameter="20"
          mode="indeterminate"
          color="accent"
        ></mat-progress-spinner>
      </button>

      <button
            mat-raised-button
            color="accent"
            class="login-button"
            routerLink="/auth/sign-in">
            <mat-icon fontIcon="arrow_back"></mat-icon>
            <span>Back to login</span>
      </button>
    </div>
  </div>
</div>
